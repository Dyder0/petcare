<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirigiendo a Webpay | PetCare</title>
</head>
<body>
  <p>Conectando de forma segura con Webpay Plus de Transbank…</p>
  <form id="transbank-form" method="post" action="{{ checkout_url }}">
    <input type="hidden" name="token_ws" value="{{ token }}">
    <button type="submit">Continuar a Webpay Plus</button>
  </form>
  <script>document.getElementById("transbank-form").submit();</script>
</body>
</html>
